<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sole Room</title>
  <meta name="description" content="Walk an endless white gallery of sneakers. Hover a rack to look closer, click a pair to shop it." />
  <meta name="theme-color" content="#f4f2ee" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- ============ The room ============ -->
  <canvas id="room" aria-label="A curved white gallery lined with shoe racks"></canvas>

  <div class="wordmark" aria-hidden="true">Sole<span>/</span>Room</div>

  <div id="hint" class="hint">Scroll to walk &middot; hover a pair to look closer</div>

  <div id="caption" class="caption" aria-live="polite">
    <div class="caption__kicker">You are walking past</div>
    <div class="caption__title"></div>
    <div class="caption__sub"></div>
    <div class="caption__how">Swipe to walk &middot; tap a pair to open it</div>
  </div>

  <div id="tag" class="tag" aria-hidden="true">
    <div class="tag__brand"></div>
    <div class="tag__name"></div>
    <div class="tag__price"></div>
  </div>

  <div id="loader" class="loader">
    <div class="loader__mark">Sole<span>/</span>Room</div>
    <div class="loader__bar"><i></i></div>
    <div class="loader__pct">0%</div>
  </div>

  <!-- ============ Cart ============ -->
  <button id="cartBtn" class="cart-btn" aria-label="Open cart">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 8h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9L5 8Z" />
      <path d="M9 8V6.5a3 3 0 0 1 6 0V8" />
    </svg>
    <span id="cartBadge" class="cart-badge" hidden>0</span>
  </button>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Cart" aria-hidden="true">
    <header class="drawer__head">
      <h2>Your bag</h2>
      <button class="icon-btn" data-close-cart aria-label="Close cart">&times;</button>
    </header>
    <div id="cartItems" class="drawer__items"></div>
    <footer class="drawer__foot">
      <div class="drawer__row"><span>Subtotal</span><strong id="cartSubtotal">₹0</strong></div>
      <p class="drawer__note">Taxes and shipping are worked out at checkout.</p>
      <button id="checkoutBtn" class="btn btn--dark btn--block">Checkout</button>
      <p id="checkoutMsg" class="drawer__msg" hidden></p>
    </footer>
  </aside>

  <!-- ============ Product page (route #/p/:id) ============ -->
  <main id="product" class="product" hidden></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/products.js"></script>
  <script type="module" src="js/data.js"></script>
  <script type="module" src="js/cart.js"></script>
  <script type="module" src="js/checkout.js"></script>
  <script type="module" src="js/product.js"></script>
  <script type="module" src="js/gallery.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
